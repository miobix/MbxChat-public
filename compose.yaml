# Docker never rotates json-file logs by default.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    image: mbxchat
    # Localhost only: the health endpoint has no auth.
    ports:
      - "127.0.0.1:8005:8005"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mbxchat:${POSTGRES_PASSWORD:-mbxchat}@db:5432/mbxchat
      # MBXREAD_URL comes from .env only (unset = MbxRead features off).
      OLLAMA_URL: http://host.docker.internal:11434
      MCP_URL: http://mcp:8006/mcp
      ANKI_URL: http://host.docker.internal:8765
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  # MCP tool server (SPEC §7e): the bot's image, read-only tools, compose network only (no host port).
  mcp:
    image: mbxchat
    command: ["python", "-m", "mbxchat.mcp_server"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mbxchat:${POSTGRES_PASSWORD:-mbxchat}@db:5432/mbxchat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8006), 3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      bot:
        condition: service_healthy  # the bot creates the schema at startup
    restart: unless-stopped
    logging: *logging

  db:
    # Same pinned image as MbxRead: Postgres 18, pgvector available if ever needed.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_USER: mbxchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbxchat}
      POSTGRES_DB: mbxchat
    # Localhost only, for dev and tests; 5432 and 5433 are taken on this machine.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - mbxchat-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mbxchat", "-d", "mbxchat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Nightly pg_dump into BACKUP_DIR; keeps the newest 14 (same as MbxRead). Restore: README.
  backup:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      PGHOST: db
      PGUSER: mbxchat
      PGPASSWORD: ${POSTGRES_PASSWORD:-mbxchat}
      PGDATABASE: mbxchat
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/mbxchat-$$(date +%F).dump
          if pg_dump -Fc -f $$f.tmp; then
            mv $$f.tmp $$f && echo "backup ok: $$f"
            ls -1t /backups/mbxchat-*.dump | tail -n +15 | xargs -r rm --
          else
            rm -f $$f.tmp; echo "backup FAILED"
          fi
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # Auth defaults on for a non-loopback bind; the port is published on 127.0.0.1 only.
      PHOENIX_ENABLE_AUTH: "false"
    # Localhost only: the UI has no auth.
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - mbxchat-phoenix:/mnt/data
    restart: unless-stopped
    logging: *logging

  # Monitoring (SPEC §7g): scrapes bot:8005/metrics, rule in monitoring/alerts.yml.
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.external-url=http://127.0.0.1:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - mbxchat-prometheus:/prometheus
    restart: unless-stopped
    logging: *logging

  # Sends alerts to the allowed chat through the Bot API, which works while the bot is down.
  # Its config has no env expansion, so the entrypoint writes it from .env.
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    env_file: .env
    entrypoint:
      - sh
      - -c
      - |
        cat > /tmp/alertmanager.yml <<EOF
        route:
          receiver: telegram
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 4h
        receivers:
          - name: telegram
            telegram_configs:
              - bot_token: "$$TELEGRAM_BOT_TOKEN"
                chat_id: $$TELEGRAM_ALLOWED_USER_ID
        EOF
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager --cluster.listen-address=
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    environment:
      # Localhost only, like Phoenix: no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/mbxchat.json
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *logging

volumes:
  mbxchat-pg:
  mbxchat-phoenix:
  mbxchat-prometheus:
